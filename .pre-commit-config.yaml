repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        language_version: python3
      - id: ruff-format
        language_version: python3
  - repo: local
    hooks:
      - id: markdown-fenced-blank-lines
        name: Ensure fenced code blocks have surrounding blank lines
        entry: python3 scripts/lint_markdown.py
        language: system
        files: \.md$
