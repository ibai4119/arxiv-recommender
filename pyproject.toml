[project]
name = "arxiv-recommender"
version = "0.1.0"
description = "Scientific article recommender powered by arXiv metadata."
authors = [{ name = "Ibai" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "faiss-cpu",
    "fastapi",
    "numpy",
    "pandas",
    "pyarrow",
    "requests",
    "rich",
    "scikit-learn",
    "sentence-transformers",
    "uvicorn",
]

[project.scripts]
arxiv-download = "arxiv_rec.cli.download_snapshot:main"
arxiv-embed = "arxiv_rec.cli.build_index:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
