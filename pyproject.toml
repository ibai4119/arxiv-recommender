[tool.poetry]
name = "arxiv-recommender"
version = "0.1.0"
description = "Scientific article recommender powered by arXiv metadata."
authors = ["Ibai"]
readme = "README.md"
packages = [{ include = "arxiv_rec", from = "src" }]

[tool.poetry.scripts]
arxiv-download = "arxiv_rec.cli.download_snapshot:main"
arxiv-embed = "arxiv_rec.cli.build_index:main"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "*"
numpy = "*"
sentence-transformers = "*"
faiss-cpu = "*"
fastapi = "*"
uvicorn = "*"
scikit-learn = "*"
pyarrow = "*"
requests = "*"
rich = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pre-commit = "*"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"
